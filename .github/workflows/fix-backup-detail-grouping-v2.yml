name: Fix backup detail grouping v2

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust target grouping
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('front_end/my_app/src/components/BackupsWorkspace.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = r'''      const groupedFiles = backupTargets.*?      setDownloadFilename\(`\$\{detail\.backup_name\}\.zip`\);'''
          replacement = '''      const configuredTargets = backupTargets.filter((target) => target.backup_api !== "robot_db");
      const targetInfo = configuredTargets.map((target) => {
        const normalizedPath = target.path
          .replace(/\\\\/g, "/")
          .replace(/\\/+$/, "")
          .toLowerCase();
        const targetName = normalizedPath.split("/").filter(Boolean).pop() ?? normalizedPath;
        return { target, normalizedPath, targetName };
      });

      const assignments = new Map<number, number>();
      for (const file of detail.files) {
        const candidates = [file.remote_path, file.file_path]
          .filter(Boolean)
          .map((value) => value!
            .replace(/\\\\/g, "/")
            .replace(/\\/+$/, "")
            .toLowerCase());
        let bestIndex = -1;
        let bestScore = -1;

        targetInfo.forEach(({ normalizedPath, targetName }, index) => {
          let score = -1;
          for (const candidate of candidates) {
            if (candidate === normalizedPath) score = Math.max(score, 100);
            else if (candidate.startsWith(`${normalizedPath}/`)) score = Math.max(score, 90);
            else if (candidate.split("/").filter(Boolean).includes(targetName)) score = Math.max(score, 50);
          }
          if (score > bestScore) {
            bestScore = score;
            bestIndex = index;
          }
        });

        if (bestIndex >= 0 && bestScore >= 50) {
          assignments.set(file.backup_file_id, bestIndex);
        }
      }

      const groupedFiles = targetInfo
        .map(({ target }, index) => {
          const files = detail.files.filter((file) => assignments.get(file.backup_file_id) === index);
          if (!files.length) return null;

          return {
            ...files[0],
            backup_file_id: -(index + 1),
            file_name: target.label,
            file_type: target.target_type,
            file_size_mb: files.reduce((total, file) => total + Number(file.file_size_mb || 0), 0),
            remote_path: target.path,
            group_file_ids: files.map((file) => file.backup_file_id),
          };
        })
        .filter((file): file is NonNullable<typeof file> => Boolean(file));

      const groupedDetail = { ...detail, files: groupedFiles };
      setBackupDetail(groupedDetail);
      setSelectedDownloadFileIds(groupedFiles.map((file) => file.backup_file_id));
      setDownloadFilename(`${detail.backup_name}.zip`);'''

          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('backup detail grouping block not found')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit patched component
        run: |
          if git diff --quiet -- 'front_end/my_app/src/components/BackupsWorkspace.tsx'; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'front_end/my_app/src/components/BackupsWorkspace.tsx'
          git commit -m "fix: group backup detail files by target root"
          git push
