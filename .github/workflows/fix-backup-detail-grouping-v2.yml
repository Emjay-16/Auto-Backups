name: Apply backup detail mapping

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch backup detail mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('api/services/backup_service.py')
          text = backend.read_text(encoding='utf-8')
          start = text.index('def _backup_file_remote_path(')
          end = text.index('\ndef _single_manifest_remote_path', start)
          replacement = '''def _backup_file_remote_path(
    backup_file: models.BackupFile,
    manifest: Optional[Dict[str, Any]],
) -> Optional[str]:
    if not manifest:
        return None

    paths = manifest.get("paths")
    if not isinstance(paths, dict):
        return None

    remote_items = [
        item for item in paths.values()
        if isinstance(item, dict) and isinstance(item.get("remote_path"), str)
    ]
    if not remote_items:
        return None

    file_path = Path(backup_file.file_path)
    file_name = backup_file.file_name
    file_parts = {part.lower() for part in file_path.parts if part and part not in ("/", "\\\\")}

    # download_paths stores a directory under its basename, so recover the
    # original configured target from that basename when the manifest exists.
    matches = []
    for item in remote_items:
        remote_path = item["remote_path"]
        remote_name = posixpath.basename(remote_path.rstrip("/\\\\"))
        if remote_name and remote_name.lower() in file_parts:
            matches.append(remote_path)

    if len(matches) == 1:
        return matches[0]

    for item in remote_items:
        remote_path = item["remote_path"]
        if posixpath.basename(remote_path.rstrip("/\\\\")) == file_name:
            return remote_path

    if len(remote_items) == 1:
        return remote_items[0]["remote_path"]
    return None
'''
          backend.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          frontend = Path('front_end/my_app/src/components/BackupsWorkspace.tsx')
          text = frontend.read_text(encoding='utf-8')
          start = text.index('      const groupedFiles = backupTargets')
          end = text.index('    } catch (errorResponse)', start)
          replacement = '''      const configuredTargets = backupTargets.filter((target) => target.backup_api !== "robot_db");
      const normalized = (value: string) => value.replace(/\\\\/g, "/").replace(/\\/+$/, "").toLowerCase();
      const targetInfo = configuredTargets.map((target) => {
        const targetPath = normalized(target.path);
        const targetName = targetPath.split("/").filter(Boolean).pop() ?? targetPath;
        return { target, targetPath, targetName };
      });

      const assignments = new Map<number, number>();
      for (const file of detail.files) {
        const candidates = [file.remote_path, file.file_path]
          .filter((value): value is string => Boolean(value))
          .map(normalized);
        let bestIndex = -1;
        let bestScore = -1;
        targetInfo.forEach(({ targetPath, targetName }, index) => {
          let score = -1;
          for (const candidate of candidates) {
            if (candidate === targetPath) score = Math.max(score, 100);
            else if (candidate.startsWith(`${targetPath}/`)) score = Math.max(score, 90);
            else if (candidate.split("/").filter(Boolean).includes(targetName)) score = Math.max(score, 60);
          }
          if (score > bestScore) {
            bestScore = score;
            bestIndex = index;
          }
        });
        if (bestIndex >= 0 && bestScore >= 60) assignments.set(file.backup_file_id, bestIndex);
      }

      const groupedFiles = targetInfo
        .map(({ target }, index) => {
          const files = detail.files.filter((file) => assignments.get(file.backup_file_id) === index);
          if (!files.length) return null;
          return {
            ...files[0],
            backup_file_id: -(index + 1),
            file_name: target.label,
            file_type: target.target_type,
            file_size_mb: files.reduce((total, file) => total + Number(file.file_size_mb || 0), 0),
            remote_path: target.path,
            group_file_ids: files.map((file) => file.backup_file_id),
          };
        })
        .filter((file): file is NonNullable<typeof file> => Boolean(file));

      const groupedFileIds = new Set(groupedFiles.flatMap((file) => file.group_file_ids ?? []));
      const ungroupedFiles = detail.files.filter((file) => !groupedFileIds.has(file.backup_file_id));
      if (ungroupedFiles.length) {
        groupedFiles.push({
          ...ungroupedFiles[0],
          backup_file_id: -(groupedFiles.length + 1),
          file_name: "Other files",
          file_type: "other",
          file_size_mb: ungroupedFiles.reduce((total, file) => total + Number(file.file_size_mb || 0), 0),
          group_file_ids: ungroupedFiles.map((file) => file.backup_file_id),
        });
      }

      const groupedDetail = { ...detail, files: groupedFiles };
      setBackupDetail(groupedDetail);
      setSelectedDownloadFileIds(groupedFiles.map((file) => file.backup_file_id));
      setDownloadFilename(`${detail.backup_name}.zip`);
'''
          frontend.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/services/backup_service.py front_end/my_app/src/components/BackupsWorkspace.tsx
          rm -f .github/workflows/patch-backup-detail.yml .github/workflows/fix-backup-detail-grouping.yml .github/workflows/fix-backup-detail-grouping-v2.yml
          git add .github/workflows
          git commit -m "fix: group backup details by configured targets"
          git push
