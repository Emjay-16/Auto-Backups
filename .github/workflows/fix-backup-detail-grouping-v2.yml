name: Apply backup detail mapping

on:
  push:
    branches:
      - fix/backup-detail-configured-targets

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch backend detail metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          backend = Path('api/services/backup_service.py')
          text = backend.read_text(encoding='utf-8')
          pattern = r'''def _backup_file_detail\(\n    backup_file: models\.BackupFile,\n    manifest: Optional\[Dict\[str, Any\]\],\n\) -> dict:\n    detail = schemas\.BackupFileResponse\.model_validate\(backup_file\)\.model_dump\(\)\n    detail\["remote_path"\] = _backup_file_remote_path\(backup_file, manifest\)\n    return detail'''
          replacement = '''def _backup_file_detail(
              backup_file: models.BackupFile,
              manifest: Optional[Dict[str, Any]],
          ) -> dict:
              detail = schemas.BackupFileResponse.model_validate(backup_file).model_dump()
              detail["remote_path"] = _backup_file_remote_path(backup_file, manifest)
              detail["database"] = False
              detail["database_name"] = None
              detail["database_table"] = None

              file_path = Path(backup_file.file_path)
              if file_path.suffix.lower() == ".json" and file_path.exists():
                  try:
                      payload = json.loads(file_path.read_text(encoding="utf-8"))
                  except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                      payload = None
                  if isinstance(payload, dict) and isinstance(payload.get("rows"), list) and payload.get("database") and payload.get("table"):
                      detail["database"] = True
                      detail["database_name"] = str(payload.get("database"))
                      detail["database_table"] = str(payload.get("table"))
              return detail'''
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('backend detail function not found')
          backend.write_text(updated, encoding='utf-8')
          PY

      - name: Patch frontend grouping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          frontend = Path('front_end/my_app/src/components/BackupsWorkspace.tsx')
          text = frontend.read_text(encoding='utf-8')

          start_marker = '      const groupedFiles = backupTargets'
          if start_marker not in text:
              start_marker = '      const configuredTargets = backupTargets'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('frontend grouping start not found')
          end = text.find('    } catch (errorResponse)', start)
          if end < 0:
              raise SystemExit('frontend grouping end not found')

          replacement = '''      type DetailFile = BackupDetail["files"][number] & {
        group_file_ids?: number[];
        database?: boolean;
        database_name?: string | null;
        database_table?: string | null;
      };
      const detailFiles = detail.files as DetailFile[];
      const configuredTargets = backupTargets.filter((target) => target.backup_api !== "robot_db");
      const normalized = (value: string) => value.replace(/\\\\/g, "/").replace(/\\/+$/, "").toLowerCase();
      const targetInfo = configuredTargets.map((target) => {
        const targetPath = normalized(target.path);
        const targetName = targetPath.split("/").filter(Boolean).pop() ?? targetPath;
        return { target, targetPath, targetName };
      });

      const assignments = new Map<number, number>();
      for (const file of detailFiles) {
        if (file.database) continue;
        const candidates = [file.remote_path, file.file_path]
          .filter((value): value is string => Boolean(value))
          .map(normalized);
        let bestIndex = -1;
        let bestScore = -1;
        targetInfo.forEach(({ targetPath, targetName }, index) => {
          let score = -1;
          for (const candidate of candidates) {
            if (candidate === targetPath) score = Math.max(score, 100);
            else if (candidate.startsWith(`${targetPath}/`)) score = Math.max(score, 90);
            else if (candidate.split("/").filter(Boolean).includes(targetName)) score = Math.max(score, 60);
          }
          if (score > bestScore) {
            bestScore = score;
            bestIndex = index;
          }
        });
        if (bestIndex >= 0 && bestScore >= 60) assignments.set(file.backup_file_id, bestIndex);
      }

      const groupedFiles = targetInfo
        .map(({ target }, index) => {
          const files = detailFiles.filter((file) => !file.database && assignments.get(file.backup_file_id) === index);
          if (!files.length) return null;
          return {
            ...files[0],
            backup_file_id: -(index + 1),
            file_name: target.label,
            file_type: target.target_type,
            file_size_mb: files.reduce((total, file) => total + Number(file.file_size_mb || 0), 0),
            remote_path: target.path,
            group_file_ids: files.map((file) => file.backup_file_id),
          } as DetailFile;
        })
        .filter((file): file is DetailFile => Boolean(file));

      const databaseFiles = detailFiles.filter((file) => file.database);
      if (databaseFiles.length) {
        const databaseGroupId = -(groupedFiles.length + 1000);
        groupedFiles.push({
          ...databaseFiles[0],
          backup_file_id: databaseGroupId,
          file_name: "Database",
          file_type: "database",
          file_size_mb: databaseFiles.reduce((total, file) => total + Number(file.file_size_mb || 0), 0),
          remote_path: "Database",
          group_file_ids: databaseFiles.map((file) => file.backup_file_id),
        });
      }

      const assignedIds = new Set(groupedFiles.flatMap((file) => file.group_file_ids ?? []));
      const ungroupedFiles = detailFiles.filter((file) => !assignedIds.has(file.backup_file_id));
      if (ungroupedFiles.length) {
        groupedFiles.push({
          ...ungroupedFiles[0],
          backup_file_id: -(groupedFiles.length + 1),
          file_name: "Other files",
          file_type: "other",
          file_size_mb: ungroupedFiles.reduce((total, file) => total + Number(file.file_size_mb || 0), 0),
          group_file_ids: ungroupedFiles.map((file) => file.backup_file_id),
        } as DetailFile);
      }

      const groupedDetail = { ...detail, files: groupedFiles };
      setBackupDetail(groupedDetail);
      setSelectedDownloadFileIds(groupedFiles.map((file) => file.backup_file_id));
      setDownloadFilename(`${detail.backup_name}.zip`);
'''
          frontend.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Patch database display children
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('front_end/my_app/src/components/BackupsWorkspace.tsx').read_text(encoding='utf-8')
          old = '''                    {backupDetail.files.map((file) => (\n                      <button'''
          new = '''                    {backupDetail.files.map((file) => (\n                      <button'''
          if old not in text:
              raise SystemExit('file list marker not found')
          # Keep the existing list rendering; database is a selectable group.
          Path('front_end/my_app/src/components/BackupsWorkspace.tsx').write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/services/backup_service.py front_end/my_app/src/components/BackupsWorkspace.tsx
          git commit -m "fix: group backup detail paths and database json" || exit 0
          git push
